<script>
function getOwlSVG(mood = 'happy', size = 64) {
  const eyeColor = mood === 'sad' ? '#4B4B4B' : '#111111';
  const mouth = mood === 'cheering' ? `<path d="M44 58 Q50 67 56 58 Z" fill="#D94E1F"/><ellipse cx="50" cy="56" rx="6" ry="4" fill="#FF9600"/>` : `<polygon points="44,54 56,54 50,62" fill="#FF9600"/>`;
  const brows = mood === 'sad' ? `<path d="M24 30 L38 35" stroke="#58A700" stroke-width="3.5" stroke-linecap="round"/><path d="M76 30 L62 35" stroke="#58A700" stroke-width="3.5" stroke-linecap="round"/>` : '';
  const wings = mood === 'cheering' ? `<ellipse cx="14" cy="48" rx="10" ry="18" transform="rotate(-35 14 48)" fill="#58A700"/><ellipse cx="86" cy="48" rx="10" ry="18" transform="rotate(35 86 48)" fill="#58A700"/>` : `<ellipse cx="16" cy="60" rx="8" ry="15" transform="rotate(10 16 60)" fill="#58A700"/><ellipse cx="84" cy="60" rx="8" ry="15" transform="rotate(-10 84 60)" fill="#58A700"/>`;
  return `<svg width="${size}" height="${size}" viewBox="0 0 100 100" fill="none"><g>${wings}<ellipse cx="50" cy="56" rx="34" ry="34" fill="#58CC02"/><path d="M21 32 L17 16 L34 25 Z" fill="#58CC02"/><path d="M79 32 L83 16 L66 25 Z" fill="#58CC02"/><ellipse cx="50" cy="71" rx="19" ry="15" fill="#89E219"/><circle cx="35" cy="45" r="16" fill="#89E219"/><circle cx="65" cy="45" r="16" fill="#89E219"/><circle cx="35" cy="45" r="12" fill="#FFF"/><circle cx="65" cy="45" r="12" fill="#FFF"/><circle cx="37" cy="45" r="6.5" fill="${eyeColor}"/><circle cx="63" cy="45" r="6.5" fill="${eyeColor}"/><circle cx="39" cy="42.5" r="2.2" fill="#FFF"/><circle cx="65" cy="42.5" r="2.2" fill="#FFF"/>${brows}${mouth}<ellipse cx="38" cy="90" rx="7" ry="4" fill="#FF9600"/><ellipse cx="62" cy="90" rx="7" ry="4" fill="#FF9600"/></g></svg>`;
}
function getCharacterSVG(charName = 'bea', size = 68) {
  const configs = { bea: { bg: '#DDF4FF', hair: '#3B2314', skin: '#C68642', shirt: '#1CB0F6', glasses: false }, viktor: { bg: '#F5E8FF', hair: '#2B2B2B', skin: '#F1C27D', shirt: '#CE82FF', glasses: true }, lily: { bg: '#FFE8F5', hair: '#7D3C98', skin: '#FFDBAC', shirt: '#58CC02', glasses: false }, eddy: { bg: '#FFF4D6', hair: '#B9770E', skin: '#F1C27D', shirt: '#FF4B4B', glasses: false } };
  const c = configs[charName] || configs.bea;
  return `<svg width="${size}" height="${size}" viewBox="0 0 80 80" fill="none"><circle cx="40" cy="40" r="38" fill="${c.bg}" stroke="#E5E5E5" stroke-width="2"/><path d="M18 72 C18 56 62 56 62 72" fill="${c.shirt}"/><circle cx="40" cy="36" r="17" fill="${c.skin}"/><path d="M22 34 C22 18 58 18 58 34 C54 24 26 24 22 34 Z" fill="${c.hair}"/><circle cx="34" cy="37" r="2.5" fill="#222"/><circle cx="46" cy="37" r="2.5" fill="#222"/>${c.glasses ? `<circle cx="34" cy="37" r="6" stroke="#333" stroke-width="2" fill="none"/><circle cx="46" cy="37" r="6" stroke="#333" stroke-width="2" fill="none"/>` : ''}<path d="M35 45 Q40 49 45 45" stroke="#222" stroke-width="2.2" stroke-linecap="round" fill="none"/></svg>`;
}

let audioCtx = null, iosAudioUnlocked = false;
function unlockIOSAudio() {
  if (iosAudioUnlocked) return;
  iosAudioUnlocked = true;
  ensureAudioCtx();
  try { if ('speechSynthesis' in window) window.speechSynthesis.getVoices(); } catch (e) {}
}
document.addEventListener('touchstart', unlockIOSAudio, { once: true, passive: true });
document.addEventListener('click', unlockIOSAudio, { once: true, passive: true });
function ensureAudioCtx() {
  if (!audioCtx && (window.AudioContext || window.webkitAudioContext)) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
}
function playSound(type) {
  if (!state.settings.sfx) return;
  try {
    ensureAudioCtx(); if (!audioCtx) return;
    const now = audioCtx.currentTime;
    if (type === 'tap') {
      const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
      osc.type = 'sine'; osc.frequency.setValueAtTime(520, now); osc.frequency.exponentialRampToValueAtTime(660, now + 0.04);
      gain.gain.setValueAtTime(0.08, now); gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);
      osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now); osc.stop(now + 0.05);
    } else if (type === 'correct') {
      [523.25, 659.25, 783.99].forEach((freq, i) => {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + i * 0.06);
        gain.gain.setValueAtTime(0.14, now + i * 0.06); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.06 + 0.22);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.06); osc.stop(now + i * 0.06 + 0.24);
      });
    } else if (type === 'wrong') {
      [220, 185].forEach((freq, i) => {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'sawtooth'; osc.frequency.setValueAtTime(freq, now + i * 0.11);
        gain.gain.setValueAtTime(0.08, now + i * 0.11); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.11 + 0.16);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.11); osc.stop(now + i * 0.11 + 0.18);
      });
    } else if (type === 'complete') {
      [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
        const osc = audioCtx.createOscillator(), gain = audioCtx.createGain();
        osc.type = 'triangle'; osc.frequency.setValueAtTime(freq, now + i * 0.09);
        gain.gain.setValueAtTime(0.16, now + i * 0.09); gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.35);
        osc.connect(gain); gain.connect(audioCtx.destination); osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.36);
      });
    }
  } catch (e) {}
}
function speakFrench(text, slow = false) {
  if (!state.settings.voice) return;
  try {
    if (!('speechSynthesis' in window)) return;
    window.speechSynthesis.cancel();
    const utter = new SpeechSynthesisUtterance(text);
    utter.lang = 'fr-FR'; utter.rate = slow ? 0.62 : 0.92;
    const frVoice = window.speechSynthesis.getVoices().find(v => v.lang && v.lang.toLowerCase().startsWith('fr'));
    if (frVoice) utter.voice = frVoice;
    window.speechSynthesis.speak(utter);
  } catch (e) {}
}

function loadState() {
  try {
    const raw = localStorage.getItem('duo_french_adult_v1');
    if (raw) { const p = JSON.parse(raw); return { ...DEFAULT_STATE, ...p, settings: { ...DEFAULT_STATE.settings, ...(p.settings || {}) } }; }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState() {
  try {
    const u = state.leagueUsers.find(x => x.isUser); if (u) u.xp = state.xp;
    localStorage.setItem('duo_french_adult_v1', JSON.stringify(state));
  } catch (e) {}
}

        const clickHandler = node.type === 'story' ? `startStory('${node.storyId}', '${node.id}')` : `startLesson('${node.id}')`;

function renderLessonQuestion() {
  const s = lessonSession; if (!s) return;
  if (s.queue.length === 0) { renderLessonComplete(); return; }
  const q = s.queue[0];
  document.getElementById('lesson-progress-bar').style.width = `${Math.min(100, Math.round((s.completedCount / s.totalInitial) * 100))}%`;
  document.getElementById('lesson-hearts-count').textContent = s.mode === 'hearts' ? '∞' : state.hearts;
  const stage = document.getElementById('lesson-stage');

  if (q.type === 'choice') {
    stage.innerHTML = `<div class="text-xs font-black uppercase tracking-wider text-[#CE82FF] mb-1">Choose the right meaning</div><h2 class="text-2xl font-black text-[#3C3C3C] mb-5">${q.prompt}</h2><div class="flex items-center gap-4 mb-6"><div class="shrink-0">${getCharacterSVG(q.character || 'bea', 76)}</div><div class="border-2 border-[#E5E5E5] rounded-2xl px-4 py-3 flex items-center gap-3 bg-white shadow-sm"><button onclick="speakFrench('${q.french.replace(/'/g, "\\'")}')" class="duo-btn duo-btn-blue w-10 h-10 rounded-xl flex items-center justify-center shrink-0">🔊</button><span class="font-extrabold text-lg text-[#3C3C3C]">${q.french}</span></div></div><div class="grid gap-3">${q.options.map((opt, idx) => { let cls = 'duo-card-choice'; if (s.checked) { if (idx === q.answer) cls += ' correct'; else if (idx === s.selectedChoice) cls += ' wrong'; } else if (s.selectedChoice === idx) cls += ' selected'; return `<button ${s.checked ? 'disabled' : ''} onclick="selectChoice(${idx})" class="${cls} p-4 text-left flex items-center gap-3"><span class="w-7 h-7 rounded-lg border-2 border-[#E5E5E5] flex items-center justify-center text-xs font-black text-[#777777] shrink-0">${idx + 1}</span><span class="font-bold text-base">${opt}</span></button>`; }).join('')}</div>`;
    setTimeout(() => speakFrench(q.french), 150);
  } else if (q.type === 'wordbank' || q.type === 'listen') {
    const isListen = q.type === 'listen', promptPhrase = q.direction === 'en-fr' ? q.english : q.french;
    const bank = q.type === 'listen' ? (q._shuffledBank || (q._shuffledBank = [...q.tilesAnswer, ...(q.extraTiles || [])].sort(() => Math.random() - 0.5))) : (q._shuffledBank || (q._shuffledBank = [...q.bank].sort(() => Math.random() - 0.5)));
    stage.innerHTML = `<div class="text-xs font-black uppercase tracking-wider text-[#1CB0F6] mb-1">${isListen ? 'Listening' : 'Translate this sentence'}</div><h2 class="text-2xl font-black text-[#3C3C3C] mb-5">${q.prompt}</h2>${isListen ? `<div class="flex items-center justify-center gap-4 mb-6"><button onclick="speakFrench('${q.french.replace(/'/g, "\\'")}', false)" class="duo-btn duo-btn-blue w-24 h-24 rounded-3xl flex items-center justify-center text-4xl">🔊</button><button onclick="speakFrench('${q.french.replace(/'/g, "\\'")}', true)" class="duo-btn duo-btn-white w-14 h-14 rounded-2xl flex items-center justify-center text-2xl">🐢</button></div>` : `<div class="flex items-center gap-4 mb-6"><div class="shrink-0">${getOwlSVG('happy', 68)}</div><div class="border-2 border-[#E5E5E5] rounded-2xl px-4 py-3 flex items-center gap-3 bg-white">${q.direction !== 'en-fr' ? `<button onclick="speakFrench('${q.french.replace(/'/g, "\\'")}')" class="duo-btn duo-btn-blue w-10 h-10 rounded-xl flex items-center justify-center shrink-0">🔊</button>` : ''}<span class="font-extrabold text-lg text-[#3C3C3C]">${promptPhrase}</span></div></div>`}<div class="min-h-[68px] border-t-2 border-b-2 border-[#E5E5E5] py-3 mb-6 flex flex-wrap gap-2 items-center">${s.wordBankSelected.length === 0 ? '<span class="text-sm font-bold text-[#AFAFAF]">Tap words below to build your answer...</span>' : ''}${s.wordBankSelected.map((item, pos) => `<button ${s.checked ? 'disabled' : ''} onclick="removeWordTile(${pos})" class="word-tile">${item.word}</button>`).join('')}</div><div class="flex flex-wrap gap-2.5 justify-center">${bank.map((word, idx) => { const isUsed = s.wordBankSelected.some(x => x.idx === idx); return `<button ${s.checked || isUsed ? 'disabled' : ''} onclick="addWordTile(${idx}, '${word.replace(/'/g, "\\'")}')" class="word-tile ${isUsed ? 'used' : ''}">${word}</button>`; }).join('')}</div>`;
    if (isListen || q.direction !== 'en-fr') setTimeout(() => speakFrench(q.french), 150);
  } else if (q.type === 'type') {
    const accents = ['é', 'è', 'ê', 'à', 'ç', 'ù', 'î', 'ô', '’'];
    stage.innerHTML = `<div class="text-xs font-black uppercase tracking-wider text-[#58A700] mb-1">Write in French</div><h2 class="text-2xl font-black text-[#3C3C3C] mb-5">${q.prompt}</h2><div class="flex items-center gap-4 mb-5"><div class="shrink-0">${getCharacterSVG('bea', 64)}</div><div class="border-2 border-[#E5E5E5] rounded-2xl px-4 py-3 font-extrabold text-lg text-[#3C3C3C]">${q.english}</div></div><textarea id="french-type-input" ${s.checked ? 'disabled' : ''} rows="3" placeholder="Type in French..." oninput="lessonSession.typedValue = this.value; updateLessonFooter();" class="w-full border-2 border-[#E5E5E5] focus:border-[#1CB0F6] rounded-2xl p-4 text-lg font-bold bg-[#F7F7F7] outline-none resize-none">${s.typedValue}</textarea><div class="flex flex-wrap gap-1.5 mt-3">${accents.map(ch => `<button type="button" ${s.checked ? 'disabled' : ''} onclick="insertAccent('${ch}')" class="duo-btn duo-btn-white px-3 py-1.5 rounded-xl font-extrabold text-base">${ch}</button>`).join('')}</div>`;
    setTimeout(() => { const inp = document.getElementById('french-type-input'); if (inp && !s.checked) inp.focus(); }, 50);
  } else if (q.type === 'match') {
    if (!s.matchState) s.matchState = { left: [...q.pairs].map((p, i) => ({ text: p.fr, id: i })).sort(() => Math.random() - 0.5), right: [...q.pairs].map((p, i) => ({ text: p.en, id: i })).sort(() => Math.random() - 0.5), selectedLeft: null, selectedRight: null, matchedIds: [], errorPair: null };
    const ms = s.matchState;
    stage.innerHTML = `<div class="text-xs font-black uppercase tracking-wider text-[#FF9600] mb-1">Vocabulary Match</div><h2 class="text-2xl font-black text-[#3C3C3C] mb-6">${q.prompt}</h2><div class="grid grid-cols-2 gap-4"><div class="flex flex-col gap-3">${ms.left.map(item => `<button ${ms.matchedIds.includes(item.id) ? 'disabled' : ''} onclick="selectMatch('left', ${item.id}, '${item.text.replace(/'/g, "\\'")}')" class="duo-card-choice p-4 font-extrabold text-base text-center ${ms.matchedIds.includes(item.id) ? 'opacity-30 bg-[#D7FFB8] border-[#58A700]' : ''} ${ms.selectedLeft === item.id ? 'selected' : ''} ${ms.errorPair && ms.errorPair.left === item.id ? 'wrong animate-shake' : ''}">${item.text}</button>`).join('')}</div><div class="flex flex-col gap-3">${ms.right.map(item => `<button ${ms.matchedIds.includes(item.id) ? 'disabled' : ''} onclick="selectMatch('right', ${item.id})" class="duo-card-choice p-4 font-extrabold text-base text-center ${ms.matchedIds.includes(item.id) ? 'opacity-30 bg-[#D7FFB8] border-[#58A700]' : ''} ${ms.selectedRight === item.id ? 'selected' : ''} ${ms.errorPair && ms.errorPair.right === item.id ? 'wrong animate-shake' : ''}">${item.text}</button>`).join('')}</div></div>`;
  } else if (q.type === 'speak') {
    stage.innerHTML = `<div class="text-xs font-black uppercase tracking-wider text-[#1CB0F6] mb-1">Speaking Exercise</div><h2 class="text-2xl font-black text-[#3C3C3C] mb-5">${q.prompt}</h2><div class="flex items-center gap-4 mb-6"><div class="shrink-0">${getOwlSVG('happy', 68)}</div><div class="border-2 border-[#E5E5E5] rounded-2xl px-4 py-3 flex items-center gap-3 bg-white"><button onclick="speakFrench('${q.french.replace(/'/g, "\\'")}')" class="duo-btn duo-btn-blue w-10 h-10 rounded-xl flex items-center justify-center shrink-0">🔊</button><div><div class="font-extrabold text-lg text-[#3C3C3C]">${q.french}</div><div class="text-xs font-bold text-[#777777]">${q.english}</div></div></div></div><div class="flex flex-col items-center gap-3 py-4"><button id="mic-speak-btn" ${s.checked ? 'disabled' : ''} onclick="triggerSpeechCheck()" class="duo-btn duo-btn-white w-full max-w-sm py-5 rounded-2xl font-black text-base text-[#1CB0F6] flex items-center justify-center gap-3"><span class="text-2xl">🎙️</span><span>Tap to Speak</span></button><p id="speech-transcript" class="text-sm font-bold text-[#777777] min-h-[20px]"></p></div>`;
    setTimeout(() => speakFrench(q.french), 150);
  }
  updateLessonFooter();
}

function selectChoice(idx) { playSound('tap'); lessonSession.selectedChoice = idx; renderLessonQuestion(); }
function addWordTile(idx, word) { playSound('tap'); lessonSession.wordBankSelected.push({ idx, word }); if (lessonSession.queue[0].direction === 'en-fr' || lessonSession.queue[0].type === 'listen') speakFrench(word); renderLessonQuestion(); }
function removeWordTile(pos) { playSound('tap'); lessonSession.wordBankSelected.splice(pos, 1); renderLessonQuestion(); }
function insertAccent(ch) { const inp = document.getElementById('french-type-input'); if (!inp) return; const start = inp.selectionStart, end = inp.selectionEnd; inp.value = inp.value.slice(0, start) + ch + inp.value.slice(end); inp.selectionStart = inp.selectionEnd = start + 1; lessonSession.typedValue = inp.value; inp.focus(); updateLessonFooter(); }
function selectMatch(side, id, frText) {
  const ms = lessonSession.matchState; playSound('tap'); if (side === 'left' && frText) speakFrench(frText);
  if (side === 'left') ms.selectedLeft = id; else ms.selectedRight = id;
  if (ms.selectedLeft !== null && ms.selectedRight !== null) {
    if (ms.selectedLeft === ms.selectedRight) { playSound('correct'); ms.matchedIds.push(ms.selectedLeft); ms.selectedLeft = null; ms.selectedRight = null; if (ms.matchedIds.length === lessonSession.queue[0].pairs.length) { lessonSession.checked = true; lessonSession.isCorrect = true; } renderLessonQuestion(); }
    else { playSound('wrong'); ms.errorPair = { left: ms.selectedLeft, right: ms.selectedRight }; ms.selectedLeft = null; ms.selectedRight = null; renderLessonQuestion(); setTimeout(() => { if (lessonSession && lessonSession.matchState) { lessonSession.matchState.errorPair = null; renderLessonQuestion(); } }, 450); }
  } else renderLessonQuestion();
}
function triggerSpeechCheck() {
  const btn = document.getElementById('mic-speak-btn'), transEl = document.getElementById('speech-transcript'), SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SpeechRec) { try { const rec = new SpeechRec(); rec.lang = 'fr-FR'; rec.interimResults = false; btn.innerHTML = '<span class="text-2xl animate-pulse">🔴</span><span>Listening...</span>'; rec.onresult = (e) => { transEl.textContent = `Heard: "${e.results[0][0].transcript}"`; lessonSession.speechDone = true; checkAnswer(); }; rec.onerror = () => { transEl.textContent = 'Microphone unavailable — marked as practiced!'; lessonSession.speechDone = true; checkAnswer(); }; rec.start(); return; } catch (e) {} }
  transEl.textContent = 'Pronunciation practiced!'; lessonSession.speechDone = true; checkAnswer();
}
function canCheckCurrent() {
  const s = lessonSession, q = s.queue[0];
  if (q.type === 'choice') return s.selectedChoice !== null;
  if (q.type === 'wordbank' || q.type === 'listen') return s.wordBankSelected.length > 0;
  if (q.type === 'type') return s.typedValue.trim().length > 0;
  if (q.type === 'speak') return s.speechDone;
  if (q.type === 'match') return s.matchState && s.matchState.matchedIds.length === q.pairs.length;
  return false;
}
function normalizeStr(str) { return str.toLowerCase().replace(/[’']/g, "'").replace(/[.,!?]/g, '').replace(/\s+/g, ' ').trim(); }
function checkAnswer() {
  const s = lessonSession, q = s.queue[0]; let correct = false, correctSolutionText = '', accentTip = '';
  if (q.type === 'choice') { correct = s.selectedChoice === q.answer; correctSolutionText = q.options[q.answer]; }
  else if (q.type === 'wordbank') { const t = q.direction === 'en-fr' ? q.frenchAnswer : q.englishAnswer; correct = normalizeStr(s.wordBankSelected.map(x => x.word).join(' ')) === normalizeStr(t.join(' ')); correctSolutionText = t.join(' '); }
  else if (q.type === 'listen') { correct = normalizeStr(s.wordBankSelected.map(x => x.word).join(' ')) === normalizeStr(q.tilesAnswer.join(' ')); correctSolutionText = q.french; state.spokenOrListenedCount += 1; }
  else if (q.type === 'type') { const u = normalizeStr(s.typedValue); correct = q.accepted.some(a => normalizeStr(a) === u); if (!correct) { const strip = x => x.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); if (q.accepted.some(a => strip(normalizeStr(a)) === strip(u))) { correct = true; accentTip = `Pay attention to the accents: ${q.accepted[0]}`; } } correctSolutionText = q.accepted[0]; }
  else if (q.type === 'speak') { correct = true; state.spokenOrListenedCount += 1; }
  else if (q.type === 'match') { correct = true; }
  s.checked = true; s.isCorrect = correct; s._correctSolutionText = correctSolutionText; s._accentTip = accentTip;
  if (correct) { playSound('correct'); if (!s.mistakeIds.has(q._qid)) s.correctFirstTry += 1; }
  else { playSound('wrong'); s.mistakeIds.add(q._qid); if (s.mode !== 'hearts') state.hearts = Math.max(0, state.hearts - 1); if (!state.mistakes.some(m => m.question.prompt === q.prompt && m.question.french === q.french)) state.mistakes.push({ lessonId: s.lessonId, question: q }); saveState(); }
  renderLessonQuestion();
  if (!correct && state.hearts <= 0 && s.mode !== 'hearts') openModal(`<div class="text-center"><div class="mx-auto w-20 mb-2">${getOwlSVG('sad', 80)}</div><h2 class="text-2xl font-black text-[#FF4B4B]">Out of Hearts!</h2><p class="text-sm font-bold text-[#777777] mt-1 mb-5">Practice to earn a heart or refill with Gems to continue.</p><div class="flex flex-col gap-2.5"><button onclick="closeModal(); closeLessonOverlay(); startPracticeLesson('hearts');" class="duo-btn duo-btn-green w-full py-3 rounded-2xl font-black uppercase text-sm">Practice for +1 Heart</button><button onclick="buyItem('hearts', 50); closeModal(); renderLessonQuestion();" ${state.gems < 50 ? 'disabled' : ''} class="duo-btn duo-btn-blue w-full py-3 rounded-2xl font-black uppercase text-sm disabled:opacity-40">Refill (💎 50)</button><button onclick="closeModal(); closeLessonOverlay();" class="w-full py-2 font-black uppercase text-xs text-[#777777]">Quit Lesson</button></div></div>`);
}
function skipQuestion() { const s = lessonSession, q = s.queue.shift(); s.queue.push(q); s.checked = false; s.selectedChoice = null; s.wordBankSelected = []; s.matchState = null; s.typedValue = ''; s.speechDone = false; renderLessonQuestion(); }
function nextQuestion() { const s = lessonSession, q = s.queue.shift(); if (s.isCorrect) s.completedCount += 1; else s.queue.push(q); s.checked = false; s.isCorrect = false; s.selectedChoice = null; s.wordBankSelected = []; s.matchState = null; s.typedValue = ''; s.speechDone = false; renderLessonQuestion(); }

function updateLessonFooter() {
  const s = lessonSession, footer = document.getElementById('lesson-footer'), inner = document.getElementById('lesson-footer-inner'), q = s.queue[0];
  if (!s.checked) {
    footer.className = 'border-t-2 border-[#E5E5E5] bg-white transition-colors duration-200';
    inner.innerHTML = `<button onclick="skipQuestion()" class="duo-btn duo-btn-white px-7 py-3 rounded-2xl font-black uppercase tracking-wider text-sm text-[#777777] w-full sm:w-auto">${q.type === 'speak' || q.type === 'listen' ? "Can't now" : 'Skip'}</button><button onclick="checkAnswer()" ${canCheckCurrent() ? '' : 'disabled'} class="duo-btn duo-btn-green px-10 py-3 rounded-2xl font-black uppercase tracking-wider text-sm w-full sm:w-auto">Check</button>`;
  } else if (s.isCorrect) {
    footer.className = 'border-t-2 border-[#B8F28B] bg-[#D7FFB8] transition-colors duration-200';
    const praise = ['Nicely done!', 'Très bien !', 'Excellent!', 'You got this!'][s.completedCount % 4];
    inner.innerHTML = `<div class="flex items-center gap-3"><div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-2xl text-[#58A700] font-black shrink-0">✓</div><div><div class="font-black text-xl text-[#58A700]">${praise}</div>${s._accentTip ? `<div class="text-sm font-bold text-[#58A700]">${s._accentTip}</div>` : (q.note ? `<div class="text-xs font-bold text-[#58A700]/90">${q.note}</div>` : '')}</div></div><button onclick="nextQuestion()" class="duo-btn duo-btn-green px-10 py-3 rounded-2xl font-black uppercase tracking-wider text-sm w-full sm:w-auto">Continue</button>`;
  } else {
    footer.className = 'border-t-2 border-[#FFB8B8] bg-[#FFDFE0] transition-colors duration-200';
    inner.innerHTML = `<div class="flex items-center gap-3"><div class="w-12 h-12 rounded-full bg-white flex items-center justify-center text-2xl text-[#EA2B2B] font-black shrink-0">✕</div><div><div class="font-black text-lg text-[#EA2B2B]">Correct solution:</div><div class="font-extrabold text-sm text-[#EA2B2B]">${s._correctSolutionText}</div>${q.note ? `<div class="text-xs font-bold text-[#EA2B2B]/85 mt-0.5">${q.note}</div>` : ''}</div></div><button onclick="nextQuestion()" class="duo-btn duo-btn-red px-10 py-3 rounded-2xl font-black uppercase tracking-wider text-sm w-full sm:w-auto">Got it</button>`;
  }
}

function renderLessonComplete() {
  const s = lessonSession; playSound('complete');
  try { if (typeof confetti === 'function') confetti({ particleCount: 90, spread: 70, origin: { y: 0.6 } }); } catch (e) {}
  let earnedXp = s.mode === 'hearts' ? 10 : 15;
  if (state.doubleXpLessons > 0) { earnedXp *= 2; state.doubleXpLessons -= 1; }
  const accuracy = Math.round((s.correctFirstTry / s.totalInitial) * 100);
  state.xp += earnedXp; state.gems += 10; state.lessonsCompletedCount += 1; state.wordsLearned += 4;
  if (s.mode === 'lesson' && !state.completedNodes.includes(s.lessonId)) state.completedNodes.push(s.lessonId);
  if (s.mode === 'hearts') state.hearts = Math.min(state.maxHearts, state.hearts + 1);
  saveState();
  document.getElementById('lesson-progress-bar').style.width = '100%';
  document.getElementById('lesson-footer').className = 'border-t-2 border-[#E5E5E5] bg-white';
  document.getElementById('lesson-stage').innerHTML = `<div class="text-center animate-pop py-4"><div class="mx-auto w-32 mb-3">${getOwlSVG('cheering', 128)}</div><h1 class="text-3xl font-black text-[#FFC800] mb-1">Lesson Complete!</h1><p class="text-base font-bold text-[#777777] mb-6">${s.mode === 'hearts' ? 'You earned +1 Heart!' : 'C’est magnifique ! Keep your momentum going.'}</p><div class="grid grid-cols-3 gap-3 max-w-md mx-auto"><div class="border-2 border-[#FFC800] rounded-2xl p-3 bg-[#FFFBEB]"><div class="text-xs font-black uppercase text-[#E5A900] mb-1">Total XP</div><div class="text-2xl font-black text-[#3C3C3C]">⚡ +${earnedXp}</div></div><div class="border-2 border-[#58CC02] rounded-2xl p-3 bg-[#F3FFE8]"><div class="text-xs font-black uppercase text-[#58A700] mb-1">Accuracy</div><div class="text-2xl font-black text-[#3C3C3C]">🎯 ${accuracy}%</div></div><div class="border-2 border-[#1CB0F6] rounded-2xl p-3 bg-[#EBF9FF]"><div class="text-xs font-black uppercase text-[#1899D6] mb-1">Gems</div><div class="text-2xl font-black text-[#3C3C3C]">💎 +10</div></div></div></div>`;
  document.getElementById('lesson-footer-inner').innerHTML = `<div></div><button onclick="closeLessonOverlay(); renderAll();" class="duo-btn duo-btn-green px-10 py-3.5 rounded-2xl font-black uppercase tracking-wider text-sm w-full sm:w-auto">Continue</button>`;
}

let storySession = null;
function startStory(storyId, nodeId) { const story = STORIES_DATA[storyId]; if (!story) return; playSound('tap'); storySession = { story, nodeId, stepIdx: 0, answeredCurrent: false }; document.getElementById('story-overlay').classList.remove('hidden'); document.getElementById('story-overlay').classList.add('flex'); renderStory(); }
function closeStory() { document.getElementById('story-overlay').classList.add('hidden'); document.getElementById('story-overlay').classList.remove('flex'); storySession = null; }
function renderStory() {
  const s = storySession;
  document.getElementById('story-progress-bar').style.width = `${Math.round(((s.stepIdx + 1) / s.story.steps.length) * 100)}%`;
  const stage = document.getElementById('story-stage');
  let html = `<div class="text-center mb-4"><h1 class="text-2xl font-black text-[#3C3C3C]">${s.story.title}</h1><p class="text-sm font-bold text-[#777777]">${s.story.subtitle} (Tap French lines to hear audio)</p></div>`;
  for (let i = 0; i <= s.stepIdx; i++) {
    const st = s.story.steps[i];
    if (st.type === 'narrator') html += `<div onclick="speakFrench('${st.fr.replace(/'/g, "\\'")}')" class="cursor-pointer bg-[#F7F7F7] border-2 border-[#E5E5E5] rounded-2xl p-4 animate-pop"><div class="font-extrabold text-base text-[#3C3C3C]">🔊 ${st.fr}</div><div class="text-xs font-bold text-[#777777] mt-1">${st.en}</div></div>`;
    else if (st.type === 'dialogue') html += `<div class="flex items-start gap-3 animate-pop"><div class="shrink-0">${getCharacterSVG(st.char, 54)}</div><div onclick="speakFrench('${st.fr.replace(/'/g, "\\'")}')" class="cursor-pointer border-2 border-[#E5E5E5] hover:border-[#1CB0F6] rounded-2xl p-3.5 bg-white flex-1"><div class="text-xs font-black text-[#1CB0F6] uppercase mb-0.5">${st.name}</div><div class="font-extrabold text-base text-[#3C3C3C]">🔊 ${st.fr}</div><div class="text-xs font-bold text-[#777777] mt-1">${st.en}</div></div></div>`;
    else if (st.type === 'question' && i === s.stepIdx) html += `<div class="border-2 border-[#CE82FF] bg-[#FAF3FF] rounded-2xl p-4 animate-pop"><div class="text-xs font-black uppercase text-[#A568CC] mb-1">Comprehension Check</div><div class="font-black text-base text-[#3C3C3C] mb-3">${st.prompt}</div><div class="flex flex-col gap-2">${st.options.map((opt, idx) => `<button onclick="answerStoryQ(${idx}, ${st.answer})" class="duo-card-choice p-3 text-left font-bold text-sm" id="sq-opt-${idx}">${opt}</button>`).join('')}</div></div>`;
  }
  stage.innerHTML = html;
  const cur = s.story.steps[s.stepIdx];
  document.getElementById('story-continue-btn').disabled = (cur.type === 'question' && !s.answeredCurrent);
  if (cur.fr) speakFrench(cur.fr);
  stage.scrollTop = stage.scrollHeight;
}
function answerStoryQ(idx, correctIdx) { const btn = document.getElementById(`sq-opt-${idx}`); if (idx === correctIdx) { playSound('correct'); btn.classList.add('correct'); storySession.answeredCurrent = true; document.getElementById('story-continue-btn').disabled = false; } else { playSound('wrong'); btn.classList.add('wrong'); } }
function advanceStory() {
  const s = storySession;
  if (s.stepIdx < s.story.steps.length - 1) { s.stepIdx += 1; s.answeredCurrent = false; renderStory(); }
  else { playSound('complete'); try { if (typeof confetti === 'function') confetti({ particleCount: 70, spread: 60 }); } catch (e) {} state.xp += 25; state.gems += 15; if (s.nodeId && !state.completedNodes.includes(s.nodeId)) state.completedNodes.push(s.nodeId); saveState(); closeStory(); renderAll(); showToast('📖 Story complete! +25 XP & +15 Gems'); }
}

document.addEventListener('keydown', (e) => {
  if (!lessonSession) return;
  if (e.key === 'Enter' && !e.shiftKey) { if (document.activeElement && document.activeElement.tagName === 'TEXTAREA') e.preventDefault(); if (lessonSession.checked) nextQuestion(); else if (canCheckCurrent()) checkAnswer(); }
  else if (!lessonSession.checked && lessonSession.queue[0]?.type === 'choice') { const num = parseInt(e.key, 10); if (num >= 1 && num <= lessonSession.queue[0].options.length) selectChoice(num - 1); }
});
window.onload = () => { renderAll(); };
</script>
